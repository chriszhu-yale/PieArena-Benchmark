  initial_offer_prompt: "You speak first in a negotiation of {total_rounds} rounds. Open the conversation with Felix Arana and propose a total fee for the block."

scoring:
  kind: single_issue
  unit: dollars
  batna: {side1: 339000, side2: 223000}
  issues: [{key: final_price, type: number, side1: {coef: -1}, side2: {coef: 1}}]
