    An engineering-simulation company with an industry-access account has made a final written offer of $213,600 for the window ($1.78 per GPU-hour), firm until Friday. Its runs need no enclave. Murrelet's bank call recordings need a security review and an isolated enclave, costing the center $9,400 in staff time and fees. A fee from Murrelet must cover:
    - the simulation offer: $213,600;
    - Murrelet's enclave and security review: $9,400;
