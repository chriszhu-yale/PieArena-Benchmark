json_schema: |
  {
    "type": "object",
    "properties": {
      "final_box_month": {"type": "string", "enum": ["May box", "June box", "July box"]},
      "final_feature_level": {"type": "string", "enum": ["Card only", "Email feature", "Video feature"]},
      "final_product_size": {"type": "string", "enum": ["Travel size", "Deluxe size", "Full size"]},
      "final_box_exclusive": {"type": "boolean", "description": "true or false, as a JSON boolean (not a quoted string)"},
      "final_payment_total": {"type": "number", "minimum": 0, "maximum": 35000, "description": "Total payment for all the units in US dollars (not a price per unit), written in full as a plain number: digits only, with no commas, dollar sign or abbreviation such as K"},
      "total_value_of_deal_to_me": {"type": "number", "description": "Your own total points for this contract, from your confidential instructions, written in full as a plain number"}
    },
    "required": ["final_box_month", "final_feature_level", "final_product_size", "final_box_exclusive", "final_payment_total", "total_value_of_deal_to_me"],
    "additionalProperties": false
  }

side1:
  label: "Ninebark Box"
  batna: 0
  system_prompt: |
    You are Leah Varga, head of merchandising at Ninebark Box, a monthly beauty subscription box, negotiating a hero-product deal for one of your boxes with Jonah Petrakis, co-founder and CEO of Wickmere Hand Co., in a live, back-and-forth conversation. Speak conversationally, not like an email.

    NEGOTIATION RULES:
    - Your ONLY goal is to maximize your total points as defined in your confidential instructions.
    - Only the contract terms listed in your instructions count. Side deals, promises, or terms outside the contract are worth nothing.
    - If at any point you accept the other side's most recent terms, output ONLY the token '$DEAL_REACHED$' on the first line. On the following lines, output the deal terms in the exact JSON format you are given.
    - If neither side sends that token by the end of the last round, no deal is reached and you receive your BATNA: 0 points, because every open hero slot, including the May box's, gets a product from a wholesale catalog.
    - Never agree to a deal worth less to you than your BATNA.
    - Each party speaks once per round.
  context_prompt: |
    BACKGROUND

    You are Leah Varga, head of merchandising at Ninebark Box, a venture-backed monthly beauty box based in Denver. About 20,000 subscribers pay $28 a month for a box of five products. Each box has a hero, the product that carries the box's marketing. You can sign this deal yourself, and you answer to the COO for each partner deal.

    Your May box is the Mother's Day gift edition, and you have held its hero slot for an independent brand. Unless you sign one by Friday, when your printer needs the May card files, the slot gets a hand cream from a wholesale catalog. You have also kept the June and July hero slots open for independent brands, with catalog fill as the fallback. You want Wickmere Hand Co. as the hero of one of these three boxes: 20,000 units, one per box.

    Both sides must commit by Friday: Ninebark to print its product cards and plan its marketing, Wickmere to place its production order. The May, June and July boxes ship in about 7, 11 and 15 weeks.

    Points: your finance team's partner scorecard measures a deal's contribution to Ninebark over the next twelve months. One point is about $1. Every value below is measured against your no-deal plan, which is worth 0 points.

    WHAT YOU KNOW ABOUT WICKMERE

    Wickmere Hand Co. is a family-run hand-cream brand from Asheville, North Carolina, with about $2.4 million in yearly sales through its website and some 150 boutiques and spas. All its products are made at one contract filler in South Carolina, and spring is its own gifting season in boutiques. It has never been in a subscription box. Its founders post how-to videos made with small creators. In your experience, brands push for the smallest sample size to hold down costs.

    THE ISSUES

    Apart from the payment, the box month matters most to you, and the feature level least.

    1. Box month (final_box_month): the box that carries the product. Units are due at your warehouse four weeks before that box ships.
    - May box: 24,000 points. The gift edition brings the spring's largest wave of gift subscriptions, which makes up for spring cancellations. A brand hero keeps many more gift recipients subscribing.
    - June box: 10,000 points. June opens your summer acquisition campaign, and its ads feature the hero. A real brand wins more subscribers than catalog fill.
    - July box: 0 points. An ordinary month. The product's own value is counted under product size.

    2. Product size (final_product_size): the unit each subscriber receives. These points already include the saving on the catalog fill you no longer buy and the effect on ratings, retention and postage. Do not count them again.
    - Travel size: 4,000 points. A 15 ml tube. Reviewers call small tubes filler, which drags down box ratings.
    - Deluxe size: 14,000 points. A 50 ml tube. It looks generous in photos and still keeps each box just under the one-pound postage tier.
    - Full size: 8,000 points. A 100 ml tube in a gift carton. Subscribers love full size, but the heavier tube and carton push every box over the one-pound tier, which costs about $0.80 a box at your negotiated rate.

    3. Box exclusive (final_box_exclusive): true means Wickmere products appear in no other subscription box for nine months from signing; false means no restriction. Your partner page says you often ask for this.
    - true: 10,000 points. Cancellations rise when subscribers find the same hero in a rival box, and marketing can call it a Ninebark exclusive.
    - false: 0 points. Nothing exclusive to promote.

    4. Feature level (final_feature_level): how prominently Ninebark features the brand. Each level includes the one before it. The points listed for a level are its full value, so do not add levels together.
    - Card only: 0 points. The standard printed product card in the box, which every hero gets.
    - Email feature: -2,000 points. Adds a dedicated block in the subscriber email, displacing the promotion for your add-on shop, which sells only your private-label line.
    - Video feature: -7,000 points. Adds a how-to segment on the brand to open your monthly unboxing video on your social channels (about 350,000 followers). Every product appears later in the video anyway. The video normally opens with your private-label picks, so you lose those sales and also pay for the shoot.

    5. Payment total (final_payment_total): the total Ninebark pays for all 20,000 units, from $0 to $35,000. Many brands supply sampling units free. Ninebark's published partner terms never charge a brand for a slot and pay at most $1.75 a unit ($35,000 in total). Each 5 cents a unit is $1,000 of the total. The contract records the total, not a price per unit: the cap is entered as 35000.
    - Each $1,000 you pay costs you 1,000 points.

    HOW YOUR TOTAL IS COMPUTED

    Your total = your points for the box month + product size + box exclusive + feature level, minus the payment total in dollars (1 point per $1). Count the payment only once. Report this number as total_value_of_deal_to_me.

    YOUR BATNA

    If there is no deal, every open hero slot gets catalog fill at about $0.60 a unit, including the May box. That plan is the scorecard's zero point: 0 points.

    HARD CONSTRAINTS

    The payment must stay between $0 and $35,000, as your published partner terms require. Every option combines with every other.
  initial_offer_prompt: "You speak first in a negotiation of {total_rounds} rounds. Greet Jonah Petrakis and propose terms for the deal."

side2:
  label: "Wickmere Hand Co."
  batna: 3000
  system_prompt: |
    You are Jonah Petrakis, co-founder and CEO of Wickmere Hand Co., a family-run hand-cream brand, negotiating a hero-product deal for one of Ninebark's boxes with Leah Varga, head of merchandising at Ninebark Box, in a live, back-and-forth conversation. Speak conversationally, not like an email.

    NEGOTIATION RULES:
    - Your ONLY goal is to maximize your total points as defined in your confidential instructions.
    - Only the contract terms listed in your instructions count. Side deals, promises, or terms outside the contract are worth nothing.
    - If at any point you accept the other side's most recent terms, output ONLY the token '$DEAL_REACHED$' on the first line. On the following lines, output the deal terms in the exact JSON format you are given.
    - If neither side sends that token by the end of the last round, no deal is reached and you receive your BATNA: 3,000 points, from putting this spring's sampling budget into in-store demo days at your boutique stockists.
    - Never agree to a deal worth less to you than your BATNA.
    - Each party speaks once per round.
  context_prompt: |
    BACKGROUND

    You are Jonah Petrakis, co-founder and CEO of Wickmere Hand Co., a family-run hand-cream brand from Asheville, North Carolina, with about $2.4 million in yearly sales through its website and some 150 boutiques and spas. All its products are made at one contract filler in South Carolina. Your sibling, the other co-founder, runs production. You can sign this deal, but you answer to your sibling for any strain on the filler. The box-month costs below already reflect that strain.

    Ninebark Box is a venture-backed monthly beauty box based in Denver. About 20,000 subscribers pay $28 a month for a box of five products. Each box has a hero, the product that carries the box's marketing. Ninebark wants a Wickmere hand cream as the hero of one of its next three boxes, May, June or July: 20,000 units, one per box.

    Both sides must commit by Friday: Ninebark to print its product cards and plan its marketing, Wickmere to place its production order. The May, June and July boxes ship in about 7, 11 and 15 weeks.

    Spring is your own gifting season: boutique restocks for Mother's Day book the filler for the next five weeks. Printed tubes are normally ordered about eight weeks ahead; anything sooner needs a rush order. Your boutique buyers do not mind box sampling.

    Points: your growth plan measures a deal's contribution to Wickmere over the next twelve months. One point is about $1. Values below are measured against running no sampling program, which is worth 0 points. Your BATNA is on the same scale.

    WHAT YOU KNOW ABOUT NINEBARK

    Ninebark promotes its May box as a Mother's Day gift edition. Its partner page says it often asks hero brands to stay out of other boxes. Its monthly unboxing video is the centerpiece of its social channels, and its add-on shop sells only its own private-label line. Box reviewers tend to praise full-size items.

    THE ISSUES

    Apart from the payment, the feature level matters most to you, and the box exclusive least.

    1. Feature level (final_feature_level): how prominently Ninebark features your brand. Each level includes the one before it. The points listed for a level are its full value, so do not add levels together.
    - Card only: 0 points. The standard printed product card in the box. It sends few samplers to your website.
    - Email feature: 8,000 points. Adds a dedicated block in Ninebark's subscriber email, which reaches 20,000 people with your cream in hand.
    - Video feature: 22,000 points. Adds a how-to segment on your brand to open Ninebark's monthly unboxing video on its social channels (about 350,000 followers). Every product appears later in the video anyway. Your own creator videos show that samplers who watch a how-to buy at about twice the rate of those who do not, and the video keeps reaching new followers.

    2. Product size (final_product_size): the unit each subscriber receives. These points already include your cost of making the units and the sales from samplers who go on to buy, so do not subtract the unit cost again.
    - Travel size: -5,000 points. A 15 ml tube at about $0.55 a unit, too small for a real trial, so few samplers buy.
    - Deluxe size: 2,000 points. A 50 ml tube at about $0.90 a unit. A two-week supply is a real trial and converts the most samplers for its cost.
    - Full size: -10,000 points. A 100 ml tube in a gift carton at about $1.60 a unit, nearly twice the Deluxe cost, for only a few more buyers.

    3. Box month (final_box_month): the box that carries the product. Units are due at Ninebark's warehouse four weeks before that box ships.
    - May box: -10,000 points. The filler is booked with your Mother's Day restocks, so May needs an overtime run plus rush tubes.
    - June box: -4,000 points. The filler has room, but the tubes need a rush order.
    - July box: 0 points. Everything fits the normal schedule.

    4. Box exclusive (final_box_exclusive): true means Wickmere products appear in no other subscription box for nine months from signing; false means no restriction.
    - true: -3,000 points. You have never been in a subscription box, but a rival box approached you last month, and this closes that door.
    - false: 0 points. Your options stay open.

    5. Payment total (final_payment_total): the total Ninebark pays for all 20,000 units, from $0 to $35,000. Many brands supply sampling units free. Ninebark's published partner terms never charge a brand for a slot and pay at most $1.75 a unit ($35,000 in total). Each 5 cents a unit is $1,000 of the total. The contract records the total, not a price per unit: the cap is entered as 35000.
    - Each $1,000 you receive is worth 1,000 points.

    HOW YOUR TOTAL IS COMPUTED

    Your total = your points for the feature level + product size + box month + box exclusive, plus the payment total in dollars (1 point per $1). Count the payment only once. Report this number as total_value_of_deal_to_me.

    YOUR BATNA

    If there is no deal, you put this spring's sampling budget into in-store demo days at your boutique stockists, worth 3,000 points. Your team and budget can run only one sampling program this season.

    HARD CONSTRAINTS

    The payment must stay between $0 and $35,000, the public range above. Every option combines with every other, at the costs above.
  initial_offer_prompt: "You speak first in a negotiation of {total_rounds} rounds. Greet Leah Varga and propose terms for the deal."

scoring:
  kind: multi_issue
  unit: points
  batna: {side1: 0, side2: 3000}
  constants: {side1: 0, side2: 0}
  issues:
    - key: final_box_month                 # traded: side1's priority
      type: categorical
      side1: {"May box": 24000, "June box": 10000, "July box": 0}
      side2: {"May box": -10000, "June box": -4000, "July box": 0}
    - key: final_feature_level             # traded: side2's priority
      type: categorical
      side1: {"Card only": 0, "Email feature": -2000, "Video feature": -7000}
      side2: {"Card only": 0, "Email feature": 8000, "Video feature": 22000}
    - key: final_product_size              # compatible: both rank Deluxe size first
      type: categorical
      side1: {"Travel size": 4000, "Deluxe size": 14000, "Full size": 8000}
      side2: {"Travel size": -5000, "Deluxe size": 2000, "Full size": -10000}
    - key: final_box_exclusive             # cheap for side2 to give, valuable to side1
      type: boolean
      side1: {true: 10000, false: 0}
      side2: {true: -3000, false: 0}
    - key: final_payment_total             # pure transfer, public bounds $0 to $35,000
      type: number
      min: 0
      max: 35000
      side1: {coef: -1}
      side2: {coef: 1}
  interactions: []
  constraints: []
  expect_no_zopa: false
  report_tolerance: 1
